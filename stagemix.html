<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>StageMix 01V96</title>
<link rel="icon" href="data:,">
<style>
  /* Medidas tiradas das telas reais do TF StageMix (iPad 1280×960) × 0,8 para 1024×768. */
  :root {
    color-scheme: dark;
    --font: "DIN Alternate", "Bahnschrift", "DIN Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    --m-g: #5ec42a; --m-y: #f2b130; --m-r: #e8352e;
    --cap: 20px;
    --strip: 94.5px;
    --plate-hi: #e8e8e8; --plate-lo: #cfcfcf; --ink: #121212;
    --lit-hi: #e4e4e4; --lit-lo: #c9c7c8;
    --cue-hi: #ffc34f; --cue-lo: #f08c00;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #e8e8e8; font: 14px/1.2 var(--font); }
  body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none;
    touch-action: manipulation; overscroll-behavior: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
  button { font: inherit; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  ::selection { background: rgba(255, 255, 255, .25); }
  svg { display: block; }
  .hidden { display: none !important; }

  /* ===== METER area ===== */
  .mb { flex: none; height: 96px; display: flex; padding: 4px 8px 4px 10px; }
  .cn { flex: none; width: 96px; display: flex; flex-direction: column; }
  .cn .lbl { font-size: 12px; color: #d6d6d6; letter-spacing: .05em; display: flex; align-items: center; justify-content: center; gap: 5px; height: 16px; }
  .cn .lbl::before, .cn .lbl::after { content: ""; width: 9px; height: 1px; background: #8c8c8c; }
  .online { margin-top: 3px; height: 35px; border-radius: 5px; font-size: 19px; font-weight: 700; letter-spacing: .02em; color: #e6e6e6;
    background: linear-gradient(#5c5c5c, #4c4c4c); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16); }
  .online.ok { color: #6cbe2d; background: linear-gradient(#e4e6e1, #b9bdb6); box-shadow: inset 0 1px 0 #fff; }
  .online.warn { color: #d98a10; background: linear-gradient(#e4e6e1, #b9bdb6); }
  .cnsub { flex: 1; margin-top: 2px; background: #161616; border-radius: 0 0 5px 5px; font-size: 12px; color: #cfcfcf; padding: 9px 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cnsub.warn { color: #f2b24a; }
  .sqc { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 2px 0 0 9px; }
  .sq { width: 59px; flex: 1; border-radius: 5px; font-size: 12px; letter-spacing: .03em; color: #dadada; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative;
    background: linear-gradient(#5a5a5a, #4a4a4a); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14); }
  .sq svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .sq.on { background: linear-gradient(var(--cue-hi), var(--cue-lo)); color: #141414; }
  .sq .ring { position: absolute; inset: 0; border-radius: 5px; box-shadow: inset 0 0 0 3px #fff; opacity: 0; clip-path: inset(100% 0 0 0); }
  .sq.arming .ring { opacity: 1; clip-path: inset(0 0 0 0); transition: clip-path 700ms linear; }
  .vsep { flex: none; width: 1px; background: #4c4c4c; margin: 2px 8px 2px 10px; }
  .blocks { flex: 1; min-width: 0; display: flex; gap: 3px; position: relative; }
  .blk { flex: 0 1 74px; min-width: 0; background: #212121; border-radius: 6px; display: flex; flex-direction: column; padding: 6px 4px 0; }
  .blk .bars { flex: 1; display: flex; gap: 3px; justify-content: center; }
  .blk i { flex: 0 1 5px; min-width: 2px; position: relative; margin-top: 7px;
    background: linear-gradient(to top, var(--m-g) 0%, var(--m-g) calc(var(--gy) * 100%), var(--m-y) calc(var(--gy) * 100%), var(--m-y) calc(var(--gr) * 100%), var(--m-r) calc(var(--gr) * 100%)); }
  .blk i::before { content: ""; position: absolute; top: -7px; left: 0; right: 0; height: 5px; border-radius: 50%; background: #333; }
  .blk i b { position: absolute; inset: 0; background: #333; transform-origin: top; transform: scaleY(calc(1 - var(--l, 0))); transition: transform 30ms linear; }
  .blk i u { position: absolute; left: -2px; right: -2px; height: 2px; background: #fff; bottom: calc(var(--f, 0) * 100% - 1px); }
  .blk i u.z { height: 3px; }
  .blk i.snd u { background: var(--sc, #fff); }
  .blk i.off { filter: grayscale(1) brightness(.7); }
  .blk .bl { flex: none; height: 20px; font-size: 12px; color: #e2e2e2; text-align: center; padding-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hl { position: absolute; top: 0; bottom: 0; border: 2px solid #e8e8e8; border-radius: 7px; pointer-events: none; transition: left 160ms ease-out, width 160ms ease-out; }

  /* ===== corpo ===== */
  .body { flex: 1; min-height: 0; display: flex; position: relative; padding: 16px 8px 7px 10px; }
  .view { flex: 1; min-width: 0; display: flex; }

  /* HOME: canais + coluna SEND + Stereo */
  .home { justify-content: space-between; gap: 8px; }
  .details { flex: 0 1 auto; min-width: 0; display: flex; gap: 2px; background: #000; border-radius: 13px; overflow: hidden; touch-action: none; }
  .overview { flex: none; display: flex; gap: 2px; border-radius: 13px; overflow: hidden; background: #000; }
  .ostrip { display: flex; }
  .ostrip .st { height: 100%; }
  .st { width: var(--strip); flex: none; display: flex; flex-direction: column; position: relative; background: linear-gradient(#343434, #232122 40%, #181415); }
  .st.sel::after { content: ""; position: absolute; inset: 0; border: 2px solid #b6b6b6; border-radius: inherit; pointer-events: none; z-index: 2; }
  .details .st:first-child.sel::after { border-radius: 13px 0 0 13px; }
  .st.dis .fz { opacity: .28; pointer-events: none; }

  .proc { flex: none; height: 104px; position: relative; background: linear-gradient(#3b393a, #333132); border-bottom: 2px solid #0f0d0e; }
  .proc.blank { background: linear-gradient(#2a2a2a, #232323); }
  .knob { position: absolute; left: 13px; top: 6px; width: 50px; height: 50px; touch-action: none; cursor: ns-resize; }
  .knob svg { width: 50px; height: 50px; }
  .knob .kt { fill: none; stroke: #4a4a4a; stroke-width: 8; }
  .knob .kv { fill: none; stroke: #f0f0f0; stroke-width: 8; stroke-dasharray: 0 100; }
  .knob .kc { fill: #3a3a3a; }
  .knob span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: #f2f2f2; font-variant-numeric: tabular-nums; }
  .knob.none .kv { stroke: none; }
  .knob.none span { color: #727272; }
  .knob.smute .kv { stroke: #8a8a8a; }
  .pmt { position: absolute; left: 79px; top: 13px; width: 5px; height: 40px;
    background: linear-gradient(to top, var(--m-g) 0%, var(--m-g) 60%, var(--m-y) 60%, var(--m-y) 85%, var(--m-r) 85%); }
  .pmt::before { content: ""; position: absolute; top: -7px; left: 0; right: 0; height: 5px; border-radius: 50%; background: #0a0a0a; }
  .pmt b { position: absolute; inset: 0; background: #0a0a0a; transform-origin: top; transform: scaleY(calc(1 - var(--l, 0))); transition: transform 30ms linear; }
  .chips { position: absolute; left: 0; right: 0; top: 63px; display: flex; justify-content: center; gap: 4px; }
  .chip { height: 18px; padding: 0 7px; border-radius: 9px; background: #4b4b4b; color: #a2a2a2; font-size: 12px; max-width: 54px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.ph { width: 25px; padding: 0; font-weight: 700; }
  .chip.lit { background: #d4d4d4; color: #1b1b1b; }
  .dots { position: absolute; left: 0; right: 0; top: 91px; display: flex; justify-content: center; gap: 7px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: #8e8e8e; }
  .dots i.cur { background: #fff; }

  .fz { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding-top: 17px; }
  .oc { flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .on, .cue { width: 66px; height: 37px; border-radius: 19px; font-size: 21px; font-weight: 700; letter-spacing: .01em; }
  .on { background: linear-gradient(#404040, #333); color: #8b8b8b; box-shadow: inset 0 1px 0 rgba(255,255,255,.07); }
  .on.lit { background: linear-gradient(var(--lit-hi), var(--lit-lo)); color: #141414; box-shadow: inset 0 1px 0 #fff; }
  .cue { background: linear-gradient(#585858, #4a4a4a); color: #d9d9d9; box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
  .cue.lit { background: linear-gradient(var(--cue-hi), var(--cue-lo)); color: #141414; }
  .cue.ghost { visibility: hidden; }
  .cue.pre { background: linear-gradient(#e4e4e4, #c9c7c8); color: #141414; opacity: .55; cursor: default; }
  .fd { flex: 1; min-height: 60px; width: 100%; position: relative; margin-top: 16px; touch-action: none; cursor: ns-resize; }
  .fd .slot { position: absolute; left: 50%; width: 13px; margin-left: -5px; top: calc(var(--cap) / 2); bottom: calc(var(--cap) / 2); border-radius: 7px;
    background: linear-gradient(90deg, #0d0b0c, #151314 50%, #0d0b0c); box-shadow: inset 0 0 0 1px #1d1b1c; }
  .fd .slot i { position: absolute; left: 3px; right: 3px; bottom: 0; height: calc(var(--p, 0) * 100%); border-radius: 4px; background: var(--sc, transparent); opacity: .85; }
  .fd .mt { position: absolute; left: calc(50% - 22px); width: 6px; bottom: calc(var(--cap) / 2); height: calc((100% - var(--cap)) * 0.807);
    background: linear-gradient(to top, var(--m-g) 0%, var(--m-g) calc(var(--gy2) * 100%), var(--m-y) calc(var(--gy2) * 100%), var(--m-y) calc(var(--gr2) * 100%), var(--m-r) calc(var(--gr2) * 100%)); }
  .fd .mt::before { content: ""; position: absolute; top: -8px; left: 0; width: 6px; height: 6px; border-radius: 50%; background: #050505; }
  .fd .mt.clip::before { background: var(--m-r); }
  .fd .mt b { position: absolute; inset: 0; background: #020202; transform-origin: top; transform: scaleY(calc(1 - var(--l, 0))); transition: transform 30ms linear; }
  .fd .mt i { position: absolute; left: 0; right: 0; height: 2px; bottom: calc(var(--h, 0) * 100%); background: #ddd; opacity: .8; }
  .fd.off .mt { filter: grayscale(1) brightness(.7); }
  .fd .cap { position: absolute; left: calc(50% - 19px); width: 40px; height: var(--cap); top: calc((1 - var(--p, 0)) * (100% - var(--cap))); border-radius: 3px;
    background: linear-gradient(#cfd0d2, #a9abae 35%, #505153 50%, #3d3d3e 52%, #6a6b6d 85%, #8f9093); box-shadow: 0 0 0 1px #8d8d8d, 0 3px 4px rgba(0,0,0,.7); }
  .fd .cap::after { content: ""; position: absolute; left: 13px; right: 13px; top: 50%; height: 0; border-top: 2px solid #c8c8c8; margin-top: 1px; }
  .fd.snd .cap { background: linear-gradient(#e7b38c, #b9774a 35%, #6d3c1d 50%, #5a2f15 52%, #8a4e27 85%, #a8673a); box-shadow: 0 0 0 1px #9b6a45, 0 3px 4px rgba(0,0,0,.7); }
  .st.master .fd .cap { background: linear-gradient(#f0a3a6, #d65a61 35%, #8f1d23 50%, #7a141a 52%, #b2363d 85%, #cf5a60); box-shadow: 0 0 0 1px #e05058, 0 3px 4px rgba(0,0,0,.7); }
  .fd.drag .cap { filter: brightness(1.1); }
  .fd .sc { position: absolute; left: calc(50% + 16px); top: calc(var(--cap) / 2); bottom: calc(var(--cap) / 2); width: 30px; font-size: 10px; color: #8b8b8b; font-variant-numeric: tabular-nums; }
  .fd .sc span { position: absolute; left: 0; transform: translateY(50%); line-height: 1; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .fd .sc span::before { content: ""; width: 6px; height: 2px; background: #8b8b8b; }
  .fd .sc span.inf::before { visibility: hidden; }
  .val { flex: none; margin-top: 6px; height: 22px; min-width: 60px; padding: 0 4px; font-size: 16px; color: #f4f4f4; font-variant-numeric: tabular-nums; border-radius: 3px; }
  .val.sel, .val:active { background: #3b3b3b; }

  .nm { flex: none; height: 86px; position: relative; overflow: hidden; color: var(--ink); background: linear-gradient(var(--plate-hi), #dcdcdc 55%, var(--plate-lo)); border-top: 2px solid #000; }
  .pan { position: absolute; left: 6px; right: 6px; top: 3px; height: 24px; touch-action: none; cursor: ew-resize; }
  .pan .pl { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 11px; color: #1d1d1d; line-height: 1; }
  .pan .pl.side { color: #c0600a; }
  .pan svg { position: absolute; left: 4px; right: 4px; bottom: 0; width: calc(100% - 8px); height: 13px; }
  .pan .w { fill: #b9b9b9; }
  .pan .wf { fill: #f08a24; }
  .pan .d { fill: #2f8a05; }
  .nl { position: absolute; left: 0; right: 0; top: 28px; bottom: 8px; cursor: pointer; }
  .nl .cnum { position: absolute; left: 5px; top: 11px; font-size: 15px; color: #1d1d1d; }
  .nl .nn { position: absolute; left: 2px; right: 2px; bottom: 3px; text-align: center; font-size: 19px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; }
  .nl .nn.s1 { font-size: 16px; }
  .nl .nn.s2 { font-size: 13.5px; }
  .nl .ico { position: absolute; right: 7px; top: 1px; width: 24px; height: 34px; }
  .nm .cb { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--tc, #6d6f72); }
  .st.master .nm .cb { background: #b00004; }

  .dl { width: 52px; background: #333132; display: flex; flex-direction: column; padding: 10px 0 8px; }
  .dl .hd { font-size: 10px; letter-spacing: .06em; color: #8b8b8b; text-align: right; padding: 0 6px 6px; }
  .dl button { height: 25px; font-size: 12px; color: #d4d4d4; text-align: right; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl button.sel { background: var(--tc); color: var(--ti); }
  .dl .exit { margin: auto 4px 0; height: 26px; border: 1px solid #575757; text-align: center; color: #c8c8c8; background: #2a2829; }

  /* ===== painel lateral (voltar + canal) das telas de canal/efeito ===== */
  .rp { flex: none; width: 94px; display: flex; flex-direction: column; border-radius: 13px; overflow: hidden; background: linear-gradient(#2c2c2c, #222 30%, #1b1b1b); }
  .rp .back { flex: none; height: 102px; display: grid; place-items: center; border-bottom: 2px solid #0e0e0e; background: linear-gradient(#333, #2a2a2a); }
  .rp .back svg { width: 34px; height: 30px; fill: none; stroke: #f2f2f2; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .rp .st { width: 100%; flex: 1; background: none; }

  /* ===== telas de canal ===== */
  .cv { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 64px minmax(0, 1fr); column-gap: 12px; }
  .cv > .rp { grid-column: 2; grid-row: 1 / span 2; }
  .cv > .ch-h { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 18px; padding-left: 20px; min-width: 0; }
  .cv > .ch-b { grid-column: 1; grid-row: 2; min-height: 0; display: flex; position: relative; }
  .tpill { height: 57px; min-width: 126px; padding: 0 22px; border-radius: 29px; position: relative; overflow: hidden; font-size: 31px; font-weight: 700; color: #dadada; letter-spacing: .02em;
    background: linear-gradient(#545454, #3a3a3a); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; flex: none; }
  .tpill.lit { background: linear-gradient(#58a63a, #2f7716); color: #f2f2f2; }
  .tpill .wm { position: absolute; left: 8px; top: 8px; width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 3; opacity: .35; }
  .tpill span { position: relative; }
  .kbar { flex: 1; min-width: 0; height: 57px; border-radius: 29px; background: #262626; display: flex; align-items: center; padding: 0 8px; gap: 10px; }
  .kbar .kp { height: 45px; padding: 0 16px 0 8px; border-radius: 23px; background: #474747; display: flex; align-items: center; gap: 8px; font-size: 23px; font-weight: 700; color: #ececec; white-space: nowrap; overflow: hidden; }
  .kbar .kp i { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #ececec; display: grid; place-items: center; font-style: normal; font-size: 19px; font-weight: 400; flex: none; }
  .kbar .ks { margin-left: auto; height: 45px; min-width: 134px; border-radius: 23px; background: #474747; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 0 16px; }
  .kbar .ks svg { width: 44px; height: 24px; fill: none; stroke: #f2f2f2; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .kbar .ks b { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 10px solid #e6e6e6; }

  /* medidores das telas de canal: escala 3/6/12/20/30/60 igual à do StageMix (posições medidas nas fotos) */
  .mcol { flex: none; display: flex; flex-direction: column; align-items: center; min-height: 0; }
  .mcol .ml { font-size: 30px; color: #b4b4b4; line-height: 1; display: flex; gap: 16px; }
  .mcol .mo { font-size: 17px; color: #9a9a9a; margin-top: 6px; min-height: 1.2em; }
  .vm { position: relative; width: 62px; flex: 1; margin-top: 12px; max-height: 330px; --bx: 14px; }
  .vm .bar { position: absolute; left: var(--bx); top: 19px; bottom: 0; width: 10px; border-radius: 5px; overflow: hidden;
    background: linear-gradient(to top, var(--m-g) 0%, var(--m-g) var(--vy), var(--m-y) var(--vy), var(--m-y) var(--vr), var(--m-r) var(--vr)); }
  .vm .bar b { position: absolute; inset: 0; background: #333; transform-origin: top; transform: scaleY(calc(1 - var(--l, 0))); }
  .vm::before { content: ""; position: absolute; left: calc(var(--bx) - .5px); top: 0; width: 11px; height: 11px; border-radius: 50%; background: #3a3a3a; }
  .vm.clip::before { background: var(--m-r); }
  .vm .vs2 { position: absolute; left: calc(var(--bx) + 19px); top: 19px; bottom: 0; font-size: 16px; color: #9a9a9a; }
  .vm .vs2 span { position: absolute; transform: translateY(-50%); }
  .vm.gr::before { display: none; }
  .vm.gr .bar { top: 0; background: #333; }
  .vm.gr .bar i { position: absolute; left: 0; right: 0; top: 19px; height: calc(var(--g, 0) * (100% - 19px)); background: linear-gradient(#f6c25a, #e8902a); }
  .vm.thr { width: 74px; --bx: 30px; }
  .vm .thm { position: absolute; left: 3px; top: calc(19px + (1 - var(--t, 0)) * (100% - 19px)); margin-top: -8px; width: 0; height: 0;
    border-left: 13px solid #f2f2f2; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
  .vm .thm.none { display: none; }
  .mpair { flex: 1; min-height: 0; display: flex; gap: 2px; }
  .mpair .mcol { flex: none; }
  .mpair .vm { width: 46px; }
  .mpair .vm.gr { width: 58px; }
  .outm { width: 76px; padding-top: 6px; }
  .pkv { flex: none; margin-top: 8px; min-width: 56px; height: 26px; padding: 0 6px; border-radius: 6px; background: #1b1b1b; border: 1px solid #3c3c3c;
    color: #f2f2f2; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pkv.over { background: #b8262d; border-color: #e8352e; color: #fff; }
  .rtah { flex: none; width: 66px; height: 35px; margin-bottom: 10px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: .95;
    color: #f2f2f2; background: linear-gradient(#5c5c5c, #4a4a4a); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
  .rtah small { font-size: 10px; letter-spacing: .04em; }
  .rtah b { font-size: 18px; letter-spacing: .02em; }
  .rtah.lit { background: linear-gradient(var(--lit-hi), var(--lit-lo)); color: #141414; box-shadow: inset 0 1px 0 #fff; }
  .rtah:disabled { color: #8a8a8a; background: linear-gradient(#444, #3a3a3a); cursor: default; }

  /* EQ */
  .eqw { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .chg { position: relative; flex: 1; min-height: 120px; margin-top: 26px; }
  .chg svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; overflow: visible; }
  .chg .gl { stroke: #4a4a4a; stroke-width: 1; stroke-dasharray: 2 3; }
  .chg .gls { stroke: #6a6a6a; stroke-width: 1; }
  .chg text { fill: #d2d2d2; font-family: var(--font); }

      case "TRACK": {
        const t = { num: +tok[1], name: tok[2], flags: +tok[3], vol: +tok[4], pan: +tok[5], width: +tok[8], peak: +tok[6], sendcnt: +tok[10], recvcnt: +tok[11], color: +tok[13] };

    <button data-step="-1" aria-label="Descer"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button></div>`, valEl);

// ---------- cliques ----------
document.addEventListener("click", e => {
  const nl = e.target.closest(".st .nl");
  if (nl) {
    const st = nl.closest(".st");
    if (st.closest(".sends")) { ui.dest = st.dataset.row; ui.view = "home"; saveUi(); render(); return; }   // envio → SENDS ON FADER desse efeito
    const t = trackByNum(+st.dataset.row);   // toque no nome escolhe o canal das telas INPUT/EQ/GATE/COMP/SEND TO
    if (t && isChannel(t.name)) { ui.sel = String(t.num); lastPing = 0; saveUi(); render(); }
    return;
  }
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (b.id === "lock" || b.id === "online") return;
  if (b.id === "utilBtn") { openUtility(); return; }
  if (d.uclose) { closePop(); return; }
  if (d.ulock) { closePop(); $("#lock").click(); return; }
  if (d.ureload) { location.reload(); return; }
  if (d.view) { ui.view = d.view; ui.types = false; lastPing = 0; saveUi(); render(); return; }
  if (d.edit) { ui.view = "fx"; ui.fxBus = d.edit; ui.types = false; saveUi(); render(); return; }
  if (d.fxbus) { ui.fxBus = d.fxbus; ui.types = false; saveUi(); render(); return; }
  if (d.chstep) { stepSel(+d.chstep); return; }
  if (d.blk !== undefined) { ui.start = clamp(+d.blk * BLOCK, 0, Math.max(0, chans().length - nStrips)); ui.view = "home"; saveUi(); render(); return; }
  if (d.dest !== undefined) { ui.dest = d.dest === ui.dest ? "" : d.dest; saveUi(); closePop(); render(); return; }
  if (d.act === "send") { openDestPop(b); return; }
  if (d.proc !== undefined) { cycleProc(); return; }
  if (d.rtahold) { rtaHold = !rtaHold; rtaPk = null; b.classList.toggle("lit", rtaHold); drawEqNow(); return; }
  if (d.pkv) { delete pkHold[d.pkv]; render(); toast("Pico zerado"); return; }
  if (b.classList.contains("back")) { ui.view = "home"; saveUi(); render(); return; }
  if (locked) { toast("Tela travada: segure LOCK"); return; }
  if (b.classList.contains("val")) { openStepper(b); return; }
  if (d.on !== undefined) {
    const [t, y] = d.on.split(".");
    if (y !== undefined) { sendNative(`sm${t}.${y}`, `SET/TRACK/${t}/SEND/${y}/MUTE/-1`); hold(`sm${t}.${y}`); }
    else { sendNative("m" + t, `SET/TRACK/${t}/MUTE/-1`); hold("m" + t); }
    b.classList.toggle("lit");
    b.closest(".st")?.querySelector(".fd")?.classList.toggle("off", !b.classList.contains("lit"));
    return;
  }
  if (d.cue !== undefined) { sendNative("s" + d.cue, `SET/TRACK/${d.cue}/SOLO/-1`); hold("s" + d.cue); b.classList.toggle("lit"); return; }
  if (d.phase) {
    const v = phase[d.phase] ? 0 : 1;
    phase[d.phase] = v; hold("ph" + d.phase);
    sendNative("ph" + d.phase, `SET/TRACK/${d.phase}/B_PHASE/${v}`);
    $$(`[data-phase="${d.phase}"]`).forEach(x => x.classList.toggle("lit", !!v)); return;
  }
  if (d.act === "play") { sendNative("tp", "1007"); return; }
  if (d.act === "stop") { sendNative("tp", "1016"); return; }
  if (d.bypass) {   // liga/desliga o plugin (título EQ/GATE/COMP aceso = ligado; BYPASS aceso = desligado)
    const [t, f] = d.bypass.split(".").map(Number);
    const fx = fxState.fx.concat(chanFx).find(x => x.t === t && x.f === f);
    const cur = held(`b.${t}.${f}`) ? b._on : fx?.enabled;
    const on = !cur;
    b._on = on;
    b.classList.toggle("lit", b.classList.contains("tpill") ? on : !on);
    sendFx(`b.${t}.${f}`, `b.${t}.${f}=${on ? 1 : 0}`);
    return;
  }
  if (d.sync) { openSyncPop(b); return; }
  if (b.classList.contains("etype")) { ui.types = true; sig.fx = ""; render(); return; }
  if (d.closetypes !== undefined) { ui.types = false; sig.fx = ""; render(); return; }
  if (d.mode !== undefined) {
    const f = curFx(), p = f && pByName(f, "Mode");
    if (p && p.opts) sendFx(`p.${f.t}.${f.f}.${p.i}`, `p.${f.t}.${f.f}.${p.i}=${(+d.mode / (p.opts.length - 1)).toFixed(5)}`);
    ui.types = false; sig.fx = ""; render(); toast(p && p.opts ? p.opts[+d.mode] : "");
    return;
  }
  if (d.opt !== undefined) { sendFx(d.key, `${d.key}=${(+d.opt / (+d.n - 1)).toFixed(5)}`); closePop(); return; }
});

// LOCK: um toque trava, segurar 0,7 s destrava
(() => {
  const btn = $("#lock"); let t = 0;
  const setLock = v => {
    locked = v;
    document.body.classList.toggle("locked", v);
    btn.classList.toggle("on", v);
    $("#lockpath").setAttribute("d", v ? "M8 11V7a4 4 0 0 1 8 0v4" : "M8 11V7a4 4 0 0 1 7.5-2");
    toast(v ? "Tela travada" : "Tela destravada");
  };
  btn.addEventListener("pointerdown", () => {
    if (!locked) return;
    btn.classList.add("arming");
    t = setTimeout(() => { btn.classList.remove("arming"); t = 0; setLock(false); btn._just = true; }, 700);
  });
  const cancel = () => { if (t) { clearTimeout(t); t = 0; btn.classList.remove("arming"); } };
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, cancel));
  btn.addEventListener("click", () => { if (btn._just) { btn._just = false; return; } if (!locked) setLock(true); else toast("Segure LOCK para destravar"); });

    return `<div class="eqw"><div class="chg"><svg id="chsvg"></svg>${note ? `<div class="eqnote">${note} · o RTA mostra o som do canal</div>` : ""}</div></div>${meterCol(`<button class="rtah" data-rtahold="1" disabled><small>RTA</small><b>HOLD</b></button><div class="ml">OUT</div><div class="mo">OVER</div>`, "outm", "outm")}`;
  }
  if (!f) return `<div class="chmsg"><b>${esc(nameInfo(t).cn)} ${esc(nameInfo(t).nn)}</b> não tem ${PLUG_HINT[view]}.</div>`;
  const D = DYN[view], vL = pFind(f, D.vL[0]), vR = pFind(f, D.vR[0]);
  return `<div class="dynw">
    ${meterCol(`<div class="ml">IN</div><div class="mo">OVER</div>`, "inm", "", "thr")}
    <div class="dynbox">
      ${vL ? vslHTML(fmtKey(f, vL), D.vL[1], numCtl(vL) && D.vL[2]) : "<div></div>"}
      <div class="dyng"><svg id="chsvg"></svg></div>
      ${vR ? vslHTML(fmtKey(f, vR), D.vR[1], numCtl(vR) && D.vR[2]) : "<div></div>"}
      <div class="hcol">${D.h.map(([re, l, sc]) => { const p = pFind(f, re); return p ? hslHTML(fmtKey(f, p), l, numCtl(p) && sc) : ""; }).join("")}</div>
    </div>
    ${grOutHTML()}
  </div>`;
}
function chHeadHTML(t, f, view) {
  const pill = view === "input" ? `<div class="tpill" style="background:none;box-shadow:none;padding-left:0">${WM.input}<span>INPUT</span></div>`
    : `<button class="tpill${f && f.enabled ? " lit" : ""}" ${f ? `data-bypass="${f.t}.${f.f}"` : "disabled"}>${WM[view]}<span>${CH_VIEWS[view]}</span></button>`;
  let bar = "";
  if (f && (view === "eq" || view === "comp")) bar = `<div class="kbar"><div class="kp"><i>1</i>${esc(fxShort(f.name))}</div>${view === "eq" ? `<div class="ks"><svg viewBox="0 0 44 24" id="bshape"></svg><b></b></div>` : ""}</div>`;
  return `<div class="ch-h">${pill}${bar}${phoneSel(t)}</div>`;
}
const SHAPES = { pk: "M2 18h12c4 0 4-12 8-12s4 12 8 12h12", ls: "M2 6h10c6 0 6 12 12 12h18", hs: "M2 18h18c6 0 6-12 12-12h10", hp: "M2 22c6-14 8-16 14-16h26", lp: "M2 6h26c6 0 8 2 14 16",
  no: "M2 8h16c2 0 3 12 4 12s2-12 4-12h16", bp: "M2 22c8 0 12-16 20-16s12 16 20 16", ap: "M2 14h40" };
function drawEq(box, t, f) {
  const svg = box.querySelector("#chsvg");
  if (!svg) return;
  const r = svg.getBoundingClientRect(), W = Math.round(r.width), H = Math.round(r.height);
  if (!W || !H) return;
  const m = f ? eqModel(f) : { bands: [], vals: [], coefs: [], fs: ana.sr || 48000, global: 0 };
  const shorts = bandShorts(m.bands), hk = m.bands.map(b => b.label + b.type + b.on).join(",");
  if (!m.bands[ui.eqBand]?.on) { const k = m.bands.findIndex(b => b.on); if (k >= 0) ui.eqBand = k; }
  if (W !== gW || H !== gH || svg._hk !== hk) {
    gW = W; gH = H; svg._hk = hk;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const g = eqGridSVG(W, H);
    svg.innerHTML = g.lo + `<path class="rta"/><path class="rtapk"/>` + g.hi + `<path class="cvf"/><path class="cv"/>` + m.bands.map((b, i) => b.on
      ? `<g class="eqh${i === ui.eqBand ? " sel" : ""}" data-band="${i}" data-fk="${fmtKey(f, b.freq)}"${b.gain && hasGain(b.type) ? ` data-gk="${fmtKey(f, b.gain)}"` : ""}><circle r="17"/><text>${shorts[i]}</text></g>` : "").join("");
    box.querySelector("#eqpop")?.remove();
    box.querySelector(".chg").insertAdjacentHTML("beforeend", `<div class="eqpop" id="eqpop"></div>`);
    sig.chk = "";
  }
  box.querySelector(".eqw")?.classList.toggle("eqoff", !f || !f.enabled);
  const c = eqCurve(m, W, H);
  svg.querySelector(".cv").setAttribute("d", c.line);
  svg.querySelector(".cvf").setAttribute("d", c.fill);
  // RTA: espectro do canal depois dos plugins (pré-fader)
  const ms = chanMeter[t.num], spec = ana.status === "ok" && ms && ms.post;
  if (spec && rtaHold) { if (!rtaPk || rtaPk._t !== t.num) { rtaPk = new Float32Array(61).fill(-200); rtaPk._t = t.num; } for (let k = 0; k < 61; k++) if (spec[k] > rtaPk[k]) rtaPk[k] = spec[k]; }
  const rd = spec ? rtaPathD(spec, W, H) : "", pd = rtaHold && rtaPk && rtaPk._t === t.num ? rtaPathD(rtaPk, W, H, true) : "";
  const rp = svg.querySelector(".rta"), rk = svg.querySelector(".rtapk");
  if (rp._d !== rd) { rp._d = rd; rp.setAttribute("d", rd); }
  if (rk._d !== pd) { rk._d = pd; rk.setAttribute("d", pd); }
  const hb = box.querySelector(".rtah");
  if (hb) { hb.disabled = !spec; hb.classList.toggle("lit", rtaHold && !!spec); }
  let selXY = null;
  svg.querySelectorAll(".eqh").forEach(h => {
    const i = +h.dataset.band, v = m.vals[i]; if (!v) return;
    const x = gx(v.hz, W), y = hasGain(v.t) ? clamp(gy(v.g, H), 0, H - PADB) : gy(0, H);
    h.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    h.classList.toggle("sel", i === ui.eqBand);
    if (i === ui.eqBand) selXY = [x, y];
  });
  // caixinha azul com Freq / Gain / Q da banda escolhida (arraste cada linha pra cima/baixo)
  const popEl = box.querySelector("#eqpop"), b = m.bands[clamp(ui.eqBand, 0, m.bands.length - 1)];
  if (!popEl || !b) return;
  const pk = "eq" + ui.eqBand + m.bands.length + b.type;
  if (sig.chk !== pk) {
    sig.chk = pk;
    const row = (p, l, u) => p ? `<div class="er ctl" data-k="param" data-axis="y" data-key="${fmtKey(f, p)}"><span>${l}</span><b data-fmt="${fmtKey(f, p)}"${u ? ` data-u="${u}"` : ""}></b></div>` : "";
    popEl.innerHTML = row(b.freq, "Freq", "hz") + (hasGain(b.type) ? row(b.gain, "Gain", "db") : "") + row(b.q, b.bw ? "BW" : "Q");
    const sh = box.querySelector("#bshape"); if (sh) sh.innerHTML = `<path d="${SHAPES[b.type] || SHAPES.pk}"/>`;
    syncParams(box, f);
  }
  if (selXY) {
    const pw = popEl.offsetWidth, ph = popEl.offsetHeight;
    let px = selXY[0] - pw / 2, py = selXY[1] - ph - 30;
    if (py < 0) py = selXY[1] + 30;
    popEl.style.left = clamp(px, PADL, W - pw) + "px"; popEl.style.top = clamp(py, 0, H - PADB - ph) + "px";
  }
}
function drawEqNow() {
  const box = $("#v-ch"), t = selTrack();
  if (!t || ui.view !== "eq" || !box.querySelector("#chsvg")) return;
  const f = chPlugin("eq", t);
  drawEq(box, t, f);
  if (f) syncParams(box, f);
}
function renderCh(cs) {
  const box = $("#v-ch"), t = selTrack(), view = ui.view;
  if (!t) { box.innerHTML = `<div class="chmsg">Esperando a 01V96…</div>`; sig.ch = ""; return; }
  const f = view !== "input" ? chPlugin(view, t) : null;
  const fresh = Date.now() - chanAt < 4000;
  const state = view === "input" ? "in" : !fresh ? "old" : !chanTracks.has(t.num) ? "load" : f ? "ok" : "none";
  const s = [view, t.num, t.name, t.color, state, cs === "bridge", f ? f.name + ":" + f.params.map(p => p.i + p.name).join(",") : ""].join("#");
  if (s !== sig.ch) {
    sig.ch = s; sig.chk = ""; gW = gH = 0;
    box.innerHTML = chHeadHTML(t, f, view) + `<div class="ch-b">${chPanelHTML(t, f, view, cs)}</div>` + rpHTML(t);
  }
  updateStrip(box.querySelector(".rp .st"), t, { noSel: true });
  const ctx = view + "#" + t.num;   // trocou de canal ou de tela: números de pico começam de novo
  if (ctx !== pkCtx) { pkCtx = ctx; for (const k in pkHold) delete pkHold[k]; }
  if (view === "input") {
    box.querySelectorAll("[data-phase]").forEach(ph => { if (!held("ph" + t.num)) ph.classList.toggle("lit", !!phase[t.num]); });
    syncCtl(box.querySelector('.hsl[data-k="pan"]'), (t.pan + 1) / 2);
    syncCtl(box.querySelector('.hsl[data-k="width"]'), ((isFinite(t.width) ? t.width : 1) + 1) / 2);
    const L = chainLevels(t);   // entrada do canal: o som seco, antes dos plugins
    setLvl(box.querySelector("#bigm"), L ? L.lv[0] : null, L ? L.lvx[0] : null);
    setPk(box, "bigm", L ? L.lvx[0] : null);
    return;
  }
  if (view === "eq") {   // OUT = saída do EQ; sem EQ, a saída do canal (antes do fader)
    if (f) { syncEnable(box, f); syncParams(box, f); }
    const L = f ? null : chainLevels(t), lv = f ? fxLevels(t, f) : { out: L ? L.lv[L.lv.length - 1] : null, outx: L ? L.lvx[L.lvx.length - 1] : null };
    setLvl(box.querySelector("#outm"), lv.out, lv.outx);
    setPk(box, "outm", lv.outx);
    drawEq(box, t, f);
    return;
  }
  if (!f) return;
  syncEnable(box, f);
  syncParams(box, f);
  const lv = fxLevels(t, f);
  setLvl(box.querySelector("#inm"), lv.inp, lv.inpx);
  setLvl(box.querySelector("#outm"), lv.out, lv.outx);
  setGr(box.querySelector("#grm"), lv.gr);
  setPk(box, "inm", lv.inpx); setPk(box, "outm", lv.outx); setPk(box, "grm", lv.gr, true);
  const thrP = pFind(f, /^thresh/i), thr = thrP ? numOf(thrP.fmt) : NaN, inm = box.querySelector("#inm");
  if (inm) { inm.querySelector(".thm")?.classList.toggle("none", !isFinite(thr)); inm.style.setProperty("--t", tfPos(thr).toFixed(4)); }
  const svg = box.querySelector("#chsvg");
  if (!svg) return;
  const r = svg.getBoundingClientRect(), W = Math.round(r.width), H = Math.round(r.height);
  if (!W || !H) return;
  if (W !== gW || H !== gH) {
    gW = W; gH = H;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = dynGridSVG(W, H) + `<path class="fill"/><path class="ln"/><circle class="dot" r="6"/>`;
  }
  const g = dynGraph(view, f, W, H);
  svg.querySelector(".fill").setAttribute("d", g.fill);
  svg.querySelector(".ln").setAttribute("d", g.line);
  // bolinha no ponto de trabalho: nível que entra no plugin agora
  const dot = svg.querySelector(".dot"), on = lv.inp !== null && lv.inp > -60;
  dot.style.display = on ? "" : "none";
  if (on) { const x = clamp(lv.inp, -60, 18); dot.setAttribute("cx", g.X(x).toFixed(1)); dot.setAttribute("cy", g.Y(clamp(g.c.out(x), -60, 18)).toFixed(1)); }
}

// ---------- SEND TO (envios do canal escolhido pros efeitos) ----------
function renderSend() {
  const box = $("#v-send"), t = selTrack();
  if (!t) { box.innerHTML = `<div class="chmsg">Esperando a 01V96…</div>`; sig.send = ""; return; }
  const list = fxSendsOf(t);
  const s = [t.num, t.name, t.color, list.map(x => x.y + "." + x.other + x.dst.name + x.dst.color).join(","), innerWidth < 600].join("#");
  if (s !== sig.send) {
    sig.send = s;
    box.innerHTML = rpHTML(t) + `<div class="sends">${list.length ? list.map(x => {
      const c = tcolor(x.dst.color).c;
      return stripHTML(t, { send: x, plate: c, plateName: { cn: "FX", nn: x.dst.name }, blankProc: true, row: x.dst.num, noSel: true });
    }).join("") : `<div class="empty2">${esc(nameInfo(t).cn)} ${esc(nameInfo(t).nn)} não tem envio pros efeitos.</div>`}</div>`;
  }
  updateStrip(box.querySelector(".rp .st"), t, { noSel: true });
  for (const x of list) updateStrip(box.querySelector(`.sends .st[data-row="${x.dst.num}"]`), t, { send: x, noSel: true });
}

// ---------- FX: réplica do painel do Valhalla Supermassive ----------
function pkHTML(key, label, extra = "") {
  return `<div class="ctl pk" data-k="param" data-axis="y" data-key="${key}" ${extra}>
    <svg viewBox="0 0 64 64" aria-hidden="true"><path class="pt" d="${ARC}" pathLength="100"/><path class="pv" d="${ARC}" pathLength="100"/><circle class="pf" cx="32" cy="32" r="19"/><line class="pp" x1="32" y1="32" x2="32" y2="17"/></svg>
    <div class="pl">${esc(label)}</div><div class="pf2" data-fmt="${key}"></div></div>`;
}
function typesHTML(mode) {
  const cur = Math.round(mode.v * (mode.opts.length - 1));
  return `<div class="types"><div class="th">MODE<button data-closetypes="1">Fechar</button></div>
    <div class="tg">${mode.opts.map((o, k) => `<button data-mode="${k}" class="${k === cur ? "sel" : ""}"><i></i>${esc(o)}</button>`).join("")}</div></div>`;
}
const SM_MAIN = [["Mix", "MIX"], ["Delay_Ms", "DELAY", 'data-dl="ms"'], ["DelayNote", "DELAY", 'data-dl="note"'], ["DelayWarp", "WARP"], ["Feedback", "FEEDBACK"], ["Density", "DENSITY"], ["Width", "WIDTH"]];
const SM_SUB = [["LowCut", "LOW CUT"], ["HighCut", "HIGH CUT"], ["ModRate", "MOD RATE"], ["ModDepth", "MOD DEPTH"]];
function smPanelHTML(f) {
  const mode = pByName(f, "Mode"), sync = pByName(f, "DelaySync");
  const knob = ([n, label, extra]) => { const p = pByName(f, n); return p ? pkHTML(fmtKey(f, p), label, (p.opts ? `data-n="${p.opts.length}" ` : "") + (extra || "")) : ""; };
  return `<div class="vsm"><div class="vtop"><div class="vlogo"><b>VALHALLA</b> SUPERMASSIVE</div>
      ${mode ? (mode.opts ? `<button class="vmode etype"><span>MODE</span><b data-modefmt="1">${esc(mode.fmt)}</b><svg viewBox="0 0 12 8"><path d="M1 1.5l5 5 5-5"/></svg></button>` : `<div class="vmode"><span>MODE</span><b data-modefmt="1">${esc(mode.fmt)}</b></div>`) : ""}
      <div class="vright">${sync ? `<button class="vbtn" data-sync="${f.t}.${f.f}"><span>SYNC</span><b data-syncfmt="1">${esc(sync.fmt)}</b></button>` : ""}<button class="vbtn" data-bypass="${f.t}.${f.f}">BYPASS</button></div></div>
    <div class="vrow main">${SM_MAIN.map(knob).join("")}</div>
    <div class="vrow sub">${SM_SUB.map(knob).join("")}${mode && !mode.opts ? pkHTML(fmtKey(f, mode), "MODE") : ""}</div>
    ${ui.types && mode && mode.opts ? typesHTML(mode) : ""}</div>`;
}
function genericPanelHTML(f) {
  const ps = f.params.filter(p => !/^(reserved|bypass|delta)/i.test(p.name)).slice(0, 24);
  return `<div class="vgen"><div class="vtop"><div class="vlogo"><b>${esc(fxShort(f.name))}</b></div><div class="vright"><button class="vbtn" data-bypass="${f.t}.${f.f}">BYPASS</button></div></div>
    <div class="vrow">${ps.map(p => pkHTML(fmtKey(f, p), p.name.toUpperCase(), p.opts ? `data-n="${p.opts.length}"` : "")).join("")}</div></div>`;
}
function renderFx(cs) {
  const box = $("#v-fx"), buses = fxBuses();
  if (!buses.some(b => String(b.num) === ui.fxBus) && buses.length) ui.fxBus = String(buses[0].num);
  const bus = trackByNum(+ui.fxBus), f = curFx();
  const s = [ui.fxBus, buses.map(b => b.num + b.name + b.color).join(","), ui.types, cs === "bridge", f ? f.name + ":" + f.params.map(p => p.i + p.name + (p.opts ? p.opts.length : "")).join(",") : "none"].join("#");
  if (s !== sig.fx) {
    sig.fx = s;
    if (!bus) { box.innerHTML = `<div class="chmsg">Nenhum bus de efeito (ROOM, VERB, DELAY…) no projeto.</div>`; return; }
    box.innerHTML = `<div class="ch-h"><div class="bust">${buses.map(b => `<button data-fxbus="${b.num}" class="${String(b.num) === ui.fxBus ? "lit" : ""}" style="--tc:${tcolor(b.color).c}"><i></i>${esc(b.name)}</button>`).join("")}</div></div>
      <div class="ch-b"><div class="fxw"><div class="fxsc">${f ? (isSM(f) ? smPanelHTML(f) : genericPanelHTML(f)) : `<div class="chmsg">${cs === "bridge" ? "A ponte dos plugins não está respondendo." : "Os efeitos internos da 01V96 ainda não aparecem aqui. O fader ao lado é o master deste AUX."}</div>`}</div></div></div>
      ${rpHTML(bus)}`;
  }
  if (!bus) return;
  updateStrip(box.querySelector(".rp .st"), bus, { noSel: true });
  if (!f) return;
  syncEnable(box, f);
  const sync = pByName(f, "DelaySync"), mode = pByName(f, "Mode");
  const sf = box.querySelector("[data-syncfmt]"); if (sf && sync && sf.textContent !== sync.fmt) sf.textContent = sync.fmt;
  const mf = box.querySelector("[data-modefmt]"); if (mf && mode && mf.textContent !== mode.fmt) mf.textContent = mode.fmt;
  syncParams(box, f);
  if (isSM(f)) {
    const ms = !sync || /^(ms|msec|free)/i.test(sync.fmt);
    const a = box.querySelector('[data-dl="ms"]'), b = box.querySelector('[data-dl="note"]');
    if (a && b) { a.classList.toggle("hidden", !ms); b.classList.toggle("hidden", ms); }
  }
}
function openSyncPop(btn) {
  const f = curFx(), p = f && pByName(f, "DelaySync"); if (!p) return;
  const key = fmtKey(f, p);
  if (p.opts) {
    const cur = Math.round(p.v * (p.opts.length - 1));
    openPop(`<div class="listpop">${p.opts.map((o, k) => `<button data-opt="${k}" data-key="${key}" data-n="${p.opts.length}" class="${k === cur ? "sel" : ""}">${esc(o)}</button>`).join("")}</div>`, btn);
  } else sendFx(key, `${key}=${/^(ms|msec)/i.test(p.fmt) ? "0.50000" : "0.25000"}`);   // ponte antiga: alterna ms/nota

pollLoop();
slowLoop();
setInterval(() => { if (!busy) render(); }, 1000);
